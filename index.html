const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function ouvrir(mdp){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveKey"]);
 const cle=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},cle,u(D.c));return new TextDecoder().decode(t);}
async function essayer(mdp,retenir){try{const html=await ouvrir(mdp);if(retenir){try{localStorage.setItem("ville-mdp",mdp)}catch(e){}}document.open();document.write(html);document.close();}
 catch(e){try{localStorage.removeItem("ville-mdp")}catch(_){}document.getElementById("err").textContent="Mot de passe incorrect.";}}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();essayer(document.getElementById("m").value.trim(),document.getElementById("r").checked);});
try{const m=localStorage.getItem("ville-mdp");if(m)essayer(m,false);}catch(e){}
</script></body></html>
