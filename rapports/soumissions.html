document.querySelector("form").onsubmit=ev=>{ev.preventDefault();e.textContent="";essayer(m.value.trim(),false);};
try{const p=localStorage.getItem("ville-mdp");if(p)essayer(p,true);}catch(_){}})();</script></body></html>
